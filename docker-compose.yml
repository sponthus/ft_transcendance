# name: pong

secrets:
  hash_key:
    file: ./secrets/hash_key.txt
  api_key:
    file: ./secrets/api_key.txt
  auth_key:
    file: ./secrets/auth_key.txt
  cookie_key:
    file: ./secrets/cookie_key.txt
  git_secret:
    file: ./secrets/git_secret.txt
  git_id:
    file: ./secrets/git_id.txt

services:

  api-gateway:
    container_name: api-gateway
    build: 
      context: .
      dockerfile: ./api-gateway/Dockerfile
      args:
        API_PORT: ${API_PORT}
    env_file:
      - ".env"
    depends_on:
      nginx:
        condition: service_started
    volumes:
      - ssl_certs:/etc/ssl # For nginx SSL certs
      - ./api-gateway:/app # TODO Comment me for prod, dev only
      - ./config:/app/config # TODO Comment me for prod, dev only
    networks:
      - pongnet
    restart: always

  user-service:
    container_name: user-service
    build: 
      context: .
      dockerfile: user-service/Dockerfile
    env_file:
      - ".env"
    volumes:
      - ssl_certs:/etc/ssl # For nginx SSL certs
      - ./user-service:/app # TODO Comment me for prod, dev only
      - ./config:/app/config # TODO Comment me for prod, dev only
    networks:
      - pongnet
    secrets:
      - hash_key
      - api_key
      - auth_key
      - cookie_key
      - git_secret
      - git_id
    restart: always

  game-service:
    container_name: game-service
    build: 
      context: .
      dockerfile: ./game-service/Dockerfile
      args:
        WS_PORT: ${GAME_WS_PORT}
    env_file:
      - ".env"
    volumes:
      - ssl_certs:/etc/ssl # For nginx SSL certs
      - ./game-service:/app # TODO Comment me for prod, dev only
      - ./config:/app/config # TODO Comment me for prod, dev only
    networks:
      - pongnet
    secrets:
      - hash_key
      - api_key
      - cookie_key
    restart: always

  session-service:
    container_name: session-service
    build: 
      context: .
      dockerfile: ./session-service/Dockerfile
      args: 
        WS_PORT: ${SESSION_WS_PORT}
    env_file:
      - ".env"
    volumes:
      - ssl_certs:/etc/ssl # For nginx SSL certs
      - ./session-service:/app # TODO Comment me for prod, dev only
      - ./config:/app/config # TODO Comment me for prod, dev only
    networks:
      - pongnet
    secrets:
      - hash_key
      - api_key
      - cookie_key
    restart: always

  nginx:
    container_name: nginx
    build: ./nginx
    env_file:
      - ".env"
    ports:
      - "8080:80"
      - "4443:443"
    volumes:
      - ssl_certs:/etc/ssl # For nginx SSL certs
      - frontend_dist:/usr/share/nginx/html # Shared with frontend
      - avatar_uploads:/app/uploads # Shared with upload service
    networks:
      - pongnet
    restart: always

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    env_file: ".env"
    ports:
      - "5173:5173" # Dev only
    volumes:
      - ./frontend:/app # TODO Comment me for prod, dev only
      - ./config:/app/config # TODO Comment me for prod, dev only
      - frontend_dist:/app/dist # Prod volume for nginx
    networks:
      - pongnet

  upload-service:
    build: 
      context: .
      dockerfile: ./upload-service/Dockerfile
    env_file:
      - ".env"
    container_name: upload-service
    volumes:
      - ./config:/app/config # TODO Comment me for prod, dev only
      - ./upload-service:/app # TODO Comment me for prod, dev only
      - ssl_certs:/etc/ssl # For nginx SSL certs
      - avatar_uploads:/app/uploads # share with nginx
    secrets:
      - hash_key
      - api_key
      - cookie_key
    networks:
      - pongnet
    restart: always

volumes:
  frontend_dist:
  avatar_uploads:
  ssl_certs:

networks:
  pongnet:
    driver: bridge

